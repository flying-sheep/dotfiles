<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <dir>~/.fonts</dir>
 <dir>~/.Fontmatrix/Activated</dir>
 <match target="font">
  <!-- hinting/antialiasing -->
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="autohint">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <!-- subpixel rendering color order -->
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
 </match>
<!-- embedded font bitmaps -->
 <match target="font">
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
 </match>
 <!-- generic fonts -->
 <match target="pattern">
  <test name="family" qual="any">
    <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
    <string>Noto Serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
    <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
    <string>Noto Sans</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
    <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
    <string>Iosevka SS09</string>
  </edit>
 </match>
 <!-- Arial metric replacement with fallback to sans-serif -->
 <match>
  <test name="family">
   <string>Arial</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>TeX Gyre Heros</string>
  </edit>
  <edit mode="append_last" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match>
  <test name="family">
   <string>Helvetica</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>TeX Gyre Heros</string>
  </edit>
 </match>
 <!-- Reject uglies -->
 <selectfont>
  <rejectfont>
   <!-- Arial -->
   <glob>/usr/share/fonts/truetype/msttcorefonts/arial.ttf</glob>
   <glob>/usr/share/fonts/truetype/msttcorefonts/Arial.ttf</glob>
   <glob>/usr/share/fonts/truetype/msttcorefonts/Arial_Black.ttf</glob>
   <!-- Bad metric aliases -->
   <glob>/usr/share/fonts/TTF/DejaVu*</glob>
   <glob>/usr/share/fonts/gsfonts/URWGothic*</glob>
   <glob>/usr/share/fonts/gsfonts/Nimbus*</glob>
   <glob>/usr/share/fonts/tex-gyre/texgyrecursor*</glob>
   <!-- Buggy MathJax fonts -->
   <glob>/usr/share/fonts/mathjax*/HTML-CSS/*/woff/*MathJax*</glob>
  </rejectfont>
 </selectfont>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
